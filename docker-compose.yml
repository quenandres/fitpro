services:
  db:
    image: postgres:16-alpine
    container_name: fitpro-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitpro
      POSTGRES_USER: fitpro
      POSTGRES_PASSWORD: fitpro
    volumes:
      - fitpro-pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpro"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fitpro-net
    restart: unless-stopped

  app:
    build: .
    container_name: fitpro-app
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # El navegador corre en el host; usa el puerto publicado del API
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fitpro-net
    restart: unless-stopped

  api:
    build:
      context: ../fitpro_api
      dockerfile: Dockerfile
    container_name: fitpro-api
    ports:
      - "8000:8000"
    volumes:
      # Solo monta código; conserva dependencias pip de la imagen
      - ../fitpro_api/app:/app/app
    env_file:
      - ../fitpro_api/.env
    environment:
      PYTHONUNBUFFERED: 1
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fitpro-net
    restart: unless-stopped

volumes:
  fitpro-pgdata:

networks:
  fitpro-net:
    name: fitpro-net
    driver: bridge
